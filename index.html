<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apana India - मजदूर और ग्रामीण सेवा</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
</head>
<body>

    <!-- हेडर -->
    <header style="position: relative;">
        <div class="menu-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></div>
        <div class="logo">Apana <span>India</span></div>
        <button id="loginBtn" onclick="showPage('login')" style="position: absolute; right: 15px; top: 15px; background: #ffca28; color: #000; border: none; padding: 6px 12px; border-radius: 5px; font-weight: bold; cursor: pointer;">
            🔐 लॉगिन
        </button>
    </header>

    <!-- साइड मेनू (Sidebar) -->
    <div id="sidebar" class="sidebar">
        <div class="close-btn" onclick="toggleSidebar()"><i class="fas fa-times"></i></div>
        <h2 style="color:white; text-align:center; margin-bottom: 20px;">Apana India</h2>
        <a href="#" onclick="showPage('home')"><i class="fas fa-home"></i> होम</a>
        <a href="#" onclick="showPage('majdoor')"><i class="fas fa-hard-hat"></i> मजदूर</a>
        <a href="#" onclick="showPage('vehicle')"><i class="fas fa-car"></i> वाहन (टैक्सी)</a>
        <a href="#" onclick="showPage('rental')"><i class="fas fa-building"></i> किराया</a>
        <a href="#" onclick="showPage('complaint')"><i class="fas fa-bullhorn"></i> शिकायत</a>
        <a href="#" onclick="showPage('admin')"><i class="fas fa-user-shield"></i> एडमिन</a>
    </div>

    <!-- मुख्य कंटेंट एरिया शुरू -->
    <main>        <!-- होम पेज -->
        <section id="page-home" class="page active">
            <div class="hero">
                <h1>नमस्ते! अपना इंडिया में स्वागत है</h1>
                <p>भारत का डिजिटल प्लेटफॉर्म</p>
                <input type="text" placeholder="🔍 यहाँ खोजें (मजदूर, टैक्सी, किराया...)">
            </div>
            <div class="services-grid">
                <div class="service-card" onclick="showPage('majdoor')">
                    <i class="fas fa-hard-hat"></i><h3>मजदूर</h3>
                </div>
                <div class="service-card" onclick="showPage('vehicle')">
                    <i class="fas fa-car"></i><h3>वाहन</h3>
                </div>
                <div class="service-card" onclick="showPage('rental')">
                    <i class="fas fa-home"></i><h3>किराया</h3>
                </div>
            </div>
        </section>

        <!-- लॉगिन पेज -->
        <section id="page-login" class="page">
            <h2>🔐 लॉगिन करें</h2>
            <div class="form-box" style="text-align: center;">
                <p style="margin-bottom: 15px; color: #666;">Google से लॉगिन करें ताकि आपका डेटा सुरक्षित रहे।</p>
                
                <button id="googleLoginBtn" onclick="googleLogin()" class="btn-primary" style="background: white; color: #333; border: 1px solid #ccc; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20"> Google से लॉगिन करें
                </button>
                
                <div id="userBox" style="display: none; margin-top: 20px;">
                    <p style="color: green; font-weight: bold; margin-bottom: 10px;">✅ आप लॉगिन हैं</p>
                    <p id="userName" style="font-weight: bold; font-size: 18px; color: #0d47a1;"></p>
                    <p id="userEmail" style="color: #666; font-size: 14px; margin-bottom: 15px;"></p>
                    <button onclick="logoutUser()" class="btn-gray" style="width: 100%;">लॉगआउट</button>
                </div>
            </div>
        </section>
